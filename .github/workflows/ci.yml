# 构建、测试并打包 Haytham.Runtime。
# 推送到 main 或提交 PR 时只打包、上传为构建产物；推送 v 开头的标签（例如 v0.1.0）时，再用标签里的版本号发布到 nuget.org。
# 发布用 nuget.org 的 Trusted Publishing，不保存长期 API key，设置步骤见 docs/development.md 的“打包与发布”。
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # 验证场景和 NativeAOT 检查目前只在 Windows 上验证过，所以 CI 也用 Windows。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: dotnet restore HaythamRuntime.slnx

      - name: Build
        run: dotnet build HaythamRuntime.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test HaythamRuntime.slnx -c Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          if ($ref.StartsWith('refs/tags/v')) {
            # 标签 v1.2.3 发布为 1.2.3；包版本完全由标签决定。打包时不加 --no-build，让程序集版本也按这个版本号重新编译。
            $version = $ref.Substring('refs/tags/v'.Length)
            dotnet pack src/Haytham.Runtime/Haytham.Runtime.csproj -c Release -o artifacts/packages -p:Version=$version
          } else {
            # 非发布构建加上预发布后缀，避免和正式版本号重名。
            dotnet pack src/Haytham.Runtime/Haytham.Runtime.csproj -c Release -o artifacts/packages --version-suffix "ci.${{ github.run_number }}"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # 和 nuget.org 上 Trusted Publishing 策略里填的 Environment 一致；也可以在仓库设置里给它加审批人。
    environment: nuget
    permissions:
      # NuGet/login 用 GitHub 签发的 OIDC 令牌换取一小时有效的临时 API key。
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
